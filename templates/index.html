<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSV Report Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            width: 560px;
            margin: 80px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 35px;
            text-align: center;
            font-size: 34px;
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .file-button {
            display: inline-block;
            padding: 10px 18px;
            border: 1px solid #888;
            border-radius: 6px;
            background: #f3f3f3;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
        }

        .file-button:hover {
            background: #e7e7e7;
        }

        #file-name {
            flex: 1;
            color: #555;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .generate-button {
            width: 100%;
            padding: 12px;
            border: 1px solid #777;
            border-radius: 6px;
            background: #efefef;
            font-size: 16px;
            cursor: pointer;
        }

        .generate-button:hover {
            background: #dddddd;
        }

        .generate-button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .error-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #c33;
            border-radius: 6px;
            background: #fff5f5;
        }

        .error-box strong {
            display: block;
            margin-bottom: 8px;
        }

        .error-box ul {
            margin-bottom: 0;
            padding-left: 22px;
        }

        .success-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #398b39;
            border-radius: 6px;
            background: #f4fff4;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CSV Report Generator</h1>

    <form id="report-form">

        <div class="file-row">

            <input
                id="csv-file"
                type="file"
                name="file"
                accept=".csv"
                required
                hidden
            >

            <label for="csv-file" class="file-button">
                Choose file
            </label>

            <span id="file-name">
                No file selected
            </span>

        </div>

        <button
            id="generate-button"
            type="submit"
            class="generate-button"
        >
            Generate Excel report
        </button>

    </form>

    <div id="error-box" class="error-box"></div>

    <div id="success-box" class="success-box">
        Report generated successfully.
    </div>

</div>

<script>
    const form = document.getElementById("report-form");

    const fileInput = document.getElementById("csv-file");
    const fileName = document.getElementById("file-name");

    const generateButton = document.getElementById("generate-button");

    const errorBox = document.getElementById("error-box");
    const successBox = document.getElementById("success-box");


    fileInput.addEventListener("change", () => {

        errorBox.style.display = "none";
        successBox.style.display = "none";

        if (fileInput.files.length > 0) {
            fileName.textContent = fileInput.files[0].name;
        } else {
            fileName.textContent = "No file selected";
        }

    });


    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        errorBox.style.display = "none";
        successBox.style.display = "none";

        generateButton.disabled = true;
        generateButton.textContent = "Generating...";

        try {

            const formData = new FormData(form);

            const response = await fetch("/reports", {
                method: "POST",
                body: formData
            });


            if (!response.ok) {

                const data = await response.json();

                let errors = data.detail ?? ["Unknown error"];

                if (!Array.isArray(errors)) {
                    errors = [errors];
                }

                errorBox.innerHTML = `
                    <strong>Validation failed:</strong>

                    <ul>
                        ${errors
                            .map(error => `<li>${error}</li>`)
                            .join("")}
                    </ul>
                `;

                errorBox.style.display = "block";

                return;
            }


            const blob = await response.blob();

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = url;
            link.download = "sales_report.xlsx";

            document.body.appendChild(link);

            link.click();

            link.remove();

            URL.revokeObjectURL(url);


            successBox.style.display = "block";

        }
        catch (error) {

            errorBox.innerHTML = `
                <strong>Application error:</strong>
                <div>${error.message}</div>
            `;

            errorBox.style.display = "block";

        }
        finally {

            generateButton.disabled = false;
            generateButton.textContent = "Generate Excel report";

        }

    });
</script>

</body>
</html>
